<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ESP32 dmatrix — Web UI</title>
  <meta name="description" content="Neumorphic B&W Web UI for ESP32 dmatrix">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #f4f4f0;
      --white: #ffffff;
      --black: #000000;
      --gray: #d0d0d0;
      --accent: #ff4040;

      --font: 'Inter', sans-serif;
      --mono: 'JetBrains Mono', monospace;

      --border: 4px solid var(--black);
      --border-thin: 2px solid var(--black);
      --shadow: none;
      --shadow-sm: none;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      font-size: 16px;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--black);
      height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ── UTILS ── */
    .card {
      background: var(--white);
      border: var(--border);
      box-shadow: var(--shadow);
    }

    /* ── BUTTONS ── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 18px;
      background: var(--white);
      border: var(--border-thin);
      color: var(--black);
      font-family: var(--mono);
      font-size: 0.8rem;
      font-weight: 800;
      cursor: pointer;
      text-transform: uppercase;
      transition: background 0.1s;
    }

    .btn:hover {
      background: #eee;
    }

    .btn:active {
      background: #ddd;
    }

    .btn svg {
      width: 16px;
      height: 16px;
    }

    /* ── LAYOUT ── */
    .app {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      height: 100vh;
      overflow-y: auto;
    }

    .main-content-row {
      display: grid;
      grid-template-columns: 350px 1fr;
      gap: 24px;
      align-items: stretch;
      flex: 1;
      height: 0;
      min-height: 460px;
    }

    .left-column {
      display: grid;
      grid-template-rows: 1fr 1fr;
      gap: 12px;
      min-width: 0;
      height: 100%;
    }

    .left-column>* {
      min-height: 0;
    }

    /* ── CONNECTION BAR ── */
    .conn-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 24px;
      flex-wrap: wrap;
    }

    .conn-bar .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .conn-bar .logo svg {
      width: 32px;
      height: 32px;
    }

    .conn-bar .logo h1 {
      font-size: 1.4rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2px;
    }



    .conn-bar .spacer {
      flex: 1;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 14px;
      height: 14px;
      border: var(--border-thin);
      background: var(--white);
      transition: 0.3s;
    }

    .status-dot.connected {
      background: var(--black);
      animation: blink 2s infinite;
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.3;
      }
    }

    .status-text {
      font-family: var(--mono);
      font-size: 0.8rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .baud-select {
      background: var(--white);
      border: var(--border-thin);
      padding: 8px 12px;
      font-family: var(--mono);
      font-size: 0.8rem;
      font-weight: 700;
      outline: none;
      cursor: pointer;
    }

    /* ── DASHBOARD ── */
    .dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 8px;
    }

    .stat-card {
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      border: var(--border-thin);
      background: var(--white);
      box-shadow: var(--shadow-sm);
    }

    .stat-card .card-label {
      font-family: var(--mono);
      font-size: 0.6rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .stat-card .card-value {
      font-size: 1.2rem;
      font-weight: 900;
      font-family: var(--font);
    }

    /* ── TFT MENU SYSTEM ── */
    .tft-menu-panel {
      padding: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .tft-menu-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: var(--black);
      color: var(--white);
      border-bottom: var(--border);
    }

    .tft-menu-header .btn-back {
      padding: 6px 12px;
      font-size: 0.75rem;
      background: var(--white);
      color: var(--black);
      border: none;
    }

    .tft-menu-header .btn-back:hover {
      background: #eee;
    }

    .tft-menu-header .btn-back:active {
      background: #ddd;
    }

    .tft-menu-title {
      font-size: 0.95rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2px;
      flex: 1;
      text-align: right;
    }

    .tft-menu-body {
      padding: 4px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow-y: auto;
      background: var(--white);
      flex: 1 1 0%;
      height: 0;
      min-height: 0;
    }

    .tft-menu-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 12px;
      background: var(--white);
      border: var(--border-thin);
      cursor: pointer;
      transition: background 0.1s;
      flex: none;
      min-height: 48px;
      overflow: hidden;
    }

    .tft-menu-item:hover {
      background: #eee;
    }

    .tft-menu-item:active {
      background: #ddd;
    }

    .tft-menu-item .item-title {
      font-family: var(--mono);
      font-size: 0.85rem;
      font-weight: 800;
      letter-spacing: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tft-menu-item-content {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1;
      min-width: 0;
      padding-right: 16px;
      overflow: hidden;
    }

    .tft-menu-item .item-desc {
      font-size: 0.65rem;
      font-family: var(--font);
      font-weight: 600;
      line-height: 1.2;
      color: #444;
      text-transform: none;
      letter-spacing: normal;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .tft-menu-item svg {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
      overflow: visible;
    }

    /* ── TERMINAL ── */
    .terminal-panel {
      padding: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .terminal-header {
      display: flex;
      align-items: center;
      padding: 12px 20px;
      border-bottom: var(--border-thin);
      background: #eee;
    }

    .terminal-header .title {
      font-size: 0.9rem;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .terminal-header .spacer {
      flex: 1;
    }

    .terminal-header .line-count {
      font-family: var(--mono);
      font-size: 0.75rem;
      font-weight: 700;
      margin-right: 16px;
    }

    .terminal-body {
      flex: 1;
      min-height: 300px;
      overflow-y: auto;
      padding: 16px 20px;
      font-family: var(--mono);
      font-size: 0.8rem;
      line-height: 1.6;
      background: var(--black);
      color: var(--white);
    }

    .terminal-body .line {
      white-space: pre-wrap;
      word-break: break-all;
      color: #ccc;
    }

    .terminal-body .line.cmd {
      color: #fff;
      font-weight: 700;
    }

    .terminal-body .line.cmd::before {
      content: ">> ";
      color: var(--accent);
    }

    .terminal-body .line.info {
      color: #88ff88;
      font-weight: 700;
    }

    .terminal-body .line.error {
      color: var(--accent);
      text-decoration: underline;
    }

    .terminal-body .line.success {
      color: #00ffff;
      font-weight: 700;
    }

    .terminal-input-bar {
      display: flex;
      align-items: center;
      border-top: var(--border-thin);
    }

    .terminal-input-bar input {
      flex: 1;
      border: none;
      outline: none;
      font-family: var(--mono);
      font-size: 0.9rem;
      font-weight: 700;
      padding: 16px;
      background: var(--white);
    }

    .terminal-input-bar .btn {
      border: none;
      border-left: var(--border-thin);
      border-radius: 0;
      box-shadow: none;
      height: 100%;
      padding: 16px 24px;
    }

    .terminal-input-bar .btn:hover {
      background: #ddd;
    }

    .terminal-input-bar .btn:active {
      transform: none;
      background: #ccc;
    }

    /* ── TARGETS ── */
    .targets-panel {
      padding: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      gap: 8px;
    }

    .targets-panel>.panel-title {
      font-size: 1rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .accordion {
      border: var(--border-thin);
      background: var(--white);
      box-shadow: var(--shadow-sm);
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .accordion-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 12px;
      font-family: var(--mono);
      font-weight: 800;
      font-size: 0.8rem;
      cursor: pointer;
      background: #eee;
      flex: 1;
    }

    .accordion-header:active {
      background: #ddd;
    }

    .accordion-header svg.chevron {
      width: 16px;
      height: 16px;
      transition: transform 0.2s;
    }

    .accordion-header.open svg.chevron {
      transform: rotate(90deg);
    }

    .accordion-header.open {
      border-bottom: var(--border-thin);
      flex: 0 0 auto;
    }

    .accordion-header .acc-count {
      margin-left: auto;
      background: var(--black);
      color: var(--white);
      padding: 2px 8px;
    }

    .accordion-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
      background: var(--white);
      display: flex;
      flex-direction: column;
    }

    .accordion-body.open {
      max-height: 600px;
      flex: 1;
      overflow-y: auto;
    }

    .target-table {
      width: 100%;
      border-collapse: collapse;
    }

    .target-table th {
      text-align: left;
      padding: 8px 10px;
      font-size: 0.7rem;
      font-weight: 800;
      text-transform: uppercase;
      border-bottom: var(--border-thin);
      background: #fafafa;
    }

    .target-table td {
      padding: 8px 10px;
      font-family: var(--mono);
      font-size: 0.75rem;
      font-weight: 600;
      border-bottom: 1px solid var(--black);
    }

    /* ── MOBILE: DENSE CYBERDECK SPLIT-SCREEN ── */
    @media (max-width: 900px) {
      .main-content-row {
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .tft-menu-item svg {
        width: 18px;
        height: 18px;
      }

      .tft-menu-item .item-title {
        font-size: 0.8rem;
      }

      .tft-menu-item .item-desc {
        font-size: 0.65rem;
      }

      .terminal-body {
        font-size: 0.7rem;
      }
    }

    @media (max-width: 768px) {
      body {
        overflow: hidden;
      }

      /* Prevent entire page from bouncing/scrolling */
      .app {
        padding: 8px;
        gap: 8px;
        height: 100vh;
        overflow-y: auto;
      }

      /* Sleek Navbar for Mobile */
      .conn-bar {
        padding: 8px 12px;
        gap: 8px;
        justify-content: space-between;
        flex-wrap: nowrap;
        flex-shrink: 0;
      }

      .conn-bar .logo svg {
        width: 18px;
        height: 18px;
      }

      .conn-bar .logo h1 {
        font-size: 1rem;
      }

      .baud-select,
      .status-text {
        display: none;
      }

      .conn-bar .btn {
        padding: 6px 12px;
        font-size: 0.7rem;
      }

      .conn-bar .spacer {
        flex: 1;
      }

      .dashboard {
        grid-template-columns: repeat(5, 1fr);
        gap: 4px;
        flex-shrink: 0;
      }

      .stat-card .card-label {
        font-size: 0.5rem;
        letter-spacing: 0;
      }

      .stat-card .card-value {
        font-size: 1rem;
      }

      .stat-card {
        padding: 6px 4px;
      }

      #card-uptime {
        display: none;
      }

      /* Save space on mobile dashboard */

      /* Game Console Layout */
      .main-content-row {
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: stretch;
        height: auto;
      }

      .terminal-panel {
        order: 1;
        height: 45vh;
        flex: none;
      }

      .left-column {
        display: contents;
      }

      .tft-menu-panel {
        order: 2;
        height: 45vh;
        flex: none;
      }

      .targets-panel {
        order: 3;
        height: auto;
        flex: none;
      }

      /* Scale Down Menu */
      .tft-menu-header {
        padding: 8px;
      }

      .tft-menu-title {
        font-size: 0.8rem;
        letter-spacing: 1px;
      }

      .tft-menu-header .btn-back {
        padding: 4px 8px;
        font-size: 0.6rem;
      }

      .tft-menu-body {
        padding: 4px;
        gap: 4px;
        max-height: none;
        overflow-y: auto;
      }

      .tft-menu-item {
        padding: 8px;
        flex: 0 0 calc((100% - 24px) / 5);
        min-height: 0;
        overflow: hidden;
      }

      .tft-menu-item svg {
        display: none;
      }

      .tft-menu-item-content {
        padding-right: 0;
        gap: 2px;
      }

      .tft-menu-item .item-title {
        font-size: 0.75rem;
      }

      .tft-menu-item .item-desc {
        font-size: 0.6rem;
        line-height: 1.1;
      }

      /* Scale Down Terminal */
      .terminal-header {
        padding: 8px;
      }

      .terminal-header .title {
        font-size: 0.7rem;
        letter-spacing: 1px;
      }

      .terminal-header .line-count {
        font-size: 0.6rem;
        margin-right: 8px;
      }

      .terminal-header .btn {
        padding: 4px 8px;
        font-size: 0.6rem;
      }

      .terminal-body {
        padding: 8px;
        font-size: 0.6rem;
        flex: 1;
        min-height: 0;
        max-height: none;
        overflow-y: auto;
      }

      .terminal-input-bar input {
        padding: 8px;
        font-size: 0.7rem;
      }

      .terminal-input-bar .btn {
        padding: 8px 12px;
        font-size: 0.7rem;
      }

      /* Scale Down Targets */
      .targets-panel {
        padding: 8px;
      }

      .targets-panel>.panel-title {
        font-size: 0.8rem;
        margin-bottom: 8px;
        letter-spacing: 1px;
      }

      .targets-panel>.panel-title .btn {
        padding: 4px 8px;
        font-size: 0.6rem;
      }

      .accordion {
        margin-bottom: 8px;
      }

      .accordion-header {
        padding: 8px;
        font-size: 0.75rem;
        gap: 8px;
      }

      .accordion-header svg.chevron {
        width: 14px;
        height: 14px;
      }

      .target-table th {
        padding: 6px 8px;
        font-size: 0.6rem;
      }

      .target-table td {
        padding: 6px 8px;
        font-size: 0.65rem;
      }
    }

    @media (max-width: 480px) {
      .stat-card .card-value {
        font-size: 0.8rem;
      }
    }
  </style>
</head>

<body>
  <div class="app">

    <!-- CONNECTION BAR -->
    <div class="conn-bar card">
      <div class="logo">
        <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" fill="currentColor">
          <path
            d="M0 0h16v12h-2v4H2v-4H0V0zm2 2v8h2v4h1v-2h2v2h2v-2h2v2h1v-4h2V2H2zm6 6l1.414 1.414-.707.707L8 9.414l-.707.707-.707-.707L8 8zm2-3h2v2h-2V5zM4 5h2v2H4V5z"
            fill-rule="evenodd" />
        </svg>
        <h1>dmatrix</h1>
      </div>
      <div class="spacer"></div>
      <select class="baud-select" id="driver-select" style="margin-right:4px;">
        <option value="auto">Auto Driver</option>
        <option value="webserial">Web Serial</option>
        <option value="webusb">WebUSB</option>
      </select>
      <select class="baud-select" id="baud-select">
        <option value="115200" selected>115200 Baud</option>
        <option value="9600">9600 Baud</option>
      </select>
      <div class="status-indicator">
        <div class="status-dot" id="status-dot"></div>
        <span class="status-text" id="status-text">Offline</span>
      </div>
      <button class="btn" id="connect-btn">Connect</button>
    </div>

    <!-- DASHBOARD -->
    <div class="dashboard" id="dashboard">
      <div class="stat-card" id="card-mode">
        <span class="card-label">Mode</span>
        <span class="card-value" id="val-mode">OFF</span>
      </div>
      <div class="stat-card" id="card-aps">
        <span class="card-label">APs</span>
        <span class="card-value" id="val-aps">0</span>
      </div>
      <div class="stat-card" id="card-sta">
        <span class="card-label">Stations</span>
        <span class="card-value" id="val-sta">0</span>
      </div>
      <div class="stat-card" id="card-ble">
        <span class="card-label">BLE</span>
        <span class="card-value" id="val-ble">0</span>
      </div>
      <div class="stat-card" id="card-ch">
        <span class="card-label">Channel</span>
        <span class="card-value" id="val-ch">--</span>
      </div>
      <div class="stat-card" id="card-uptime">
        <span class="card-label">Uptime</span>
        <span class="card-value" id="val-uptime">--</span>
      </div>
    </div>

    <!-- MAIN ROW: MENU & TERMINAL -->
    <div class="main-content-row">
      <!-- LEFT COLUMN -->
      <div class="left-column">
        <!-- TFT MENU WITH HELP DESCRIPTIONS -->
        <div class="tft-menu-panel card" id="tft-menu-container">
          <div class="tft-menu-header">
            <button class="btn-back" id="menu-back-btn" style="display:none;">&lt; BACK</button>
            <span class="tft-menu-title" id="menu-title">MAIN MENU</span>
          </div>
          <div class="tft-menu-body" id="menu-body">
            <!-- Injected by JS -->
          </div>
        </div>

        <!-- TARGETS -->
        <div class="targets-panel card">
          <div class="panel-title">
            TARGETS
            <button class="btn" id="refresh-targets-btn" style="padding: 6px 12px; font-size: 0.7rem;">Refresh</button>
          </div>
          <div class="accordion">
            <div class="accordion-header" id="acc-aps-header">
              <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="9 18 15 12 9 6" />
              </svg>
              ACCESS POINTS<span class="acc-count" id="acc-aps-count">0</span>
            </div>
            <div class="accordion-body" id="acc-aps-body">
              <table class="target-table">
                <thead>
                  <tr>
                    <th>#</th>
                    <th>CH</th>
                    <th>ESSID</th>
                    <th>RSSI</th>
                  </tr>
                </thead>
                <tbody id="ap-table-body"></tbody>
              </table>
            </div>
          </div>
          <div class="accordion">
            <div class="accordion-header" id="acc-sta-header">
              <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="9 18 15 12 9 6" />
              </svg>
              STATIONS<span class="acc-count" id="acc-sta-count">0</span>
            </div>
            <div class="accordion-body" id="acc-sta-body">
              <table class="target-table">
                <thead>
                  <tr>
                    <th>#</th>
                    <th>MAC</th>
                    <th>AP</th>
                  </tr>
                </thead>
                <tbody id="sta-table-body"></tbody>
              </table>
            </div>
          </div>
          <div class="accordion">
            <div class="accordion-header" id="acc-ble-header">
              <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="9 18 15 12 9 6" />
              </svg>
              BLE DEVICES<span class="acc-count" id="acc-ble-count">0</span>
            </div>
            <div class="accordion-body" id="acc-ble-body">
              <table class="target-table">
                <thead>
                  <tr>
                    <th>#</th>
                    <th>Device</th>
                    <th>RSSI</th>
                  </tr>
                </thead>
                <tbody id="ble-table-body"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

      <!-- TERMINAL -->

                  { name: 'Spam All', cmd: 'blespam -t all', desc: 'Floods nearby BLE-enabled devices (iOS, Android, Windows) with continuous pairing popups.', icon: `<svg ${SVG_PROPS}><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>` },
                  { name: 'Sour Apple', cmd: 'blespam -t sourapple', desc: 'Targets Apple devices with BLE pairing popups causing disruption.', icon: `<svg ${SVG_PROPS}><circle cx="12" cy="12" r="10"/><path d="M16 16s-1.5-2-4-2-4 2-4 2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>` },
                  { name: 'Apple Juice', cmd: 'blespam -t applejuice', desc: 'Apple device BLE spamming using AppleJuice method.', icon: `<svg ${SVG_PROPS}><circle cx="12" cy="12" r="10"/><path d="M16 16s-1.5-2-4-2-4 2-4 2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>` },
                  { name: 'Windows Spam', cmd: 'blespam -t windows', desc: 'Targets Windows devices with SwiftPair popups.', icon: `<svg ${SVG_PROPS}><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="12" y1="3" x2="12" y2="21"/><line x1="3" y1="12" x2="21" y2="12"/></svg>` },
                  { name: 'Samsung Spam', cmd: 'blespam -t samsung', desc: 'Targets Samsung devices with BLE pairing popups.', icon: `<svg ${SVG_PROPS}><path d="M12 4c-5.5 0-10 3.5-10 8s4.5 8 10 8 10-3.5 10-8-4.5-8-10-8Z"/></svg>` },
                  { name: 'Google Spam', cmd: 'blespam -t google', desc: 'Targets Android devices using Google Fast Pair.', icon: `<svg ${SVG_PROPS}><path d="M2 12h20M12 2v20"/></svg>` },
                  { name: 'Flipper Spam', cmd: 'blespam -t flipper', desc: 'Spams Flipper Zero devices with BLE requests.', icon: `<svg ${SVG_PROPS}><path d="M3 7v10h12l3-3h3V7H3z"/><circle cx="8" cy="12" r="1"/></svg>` },
                  { name: 'Spoof AirTag', cmd: 'spoofat -t 0', desc: 'Spoofs an Apple AirTag beacon.', icon: `<svg ${SVG_PROPS}><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg>` },
                  { name: 'FindMy Track', cmd: 'findmy -t 0', desc: 'Tracks Apple FindMy devices in the area.', icon: `<svg ${SVG_PROPS}><path d="M2 12a10 10 0 0 1 20 0"/><path d="M12 12v10"/><path d="M8 16l4-4 4 4"/></svg>` }
                ]
              }
            ]
          },
          {
            name: 'GPS', icon: `<svg ${SVG_PROPS}><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>`,
            items: [
              { name: 'Start NMEA Stream', cmd: 'nmea', desc: 'Starts reading and streaming NMEA data from the GPS module.', icon: `<svg ${SVG_PROPS}><path d="M13 7 9 3 5 7l4 4"/><path d="m17 11 4 4-4 4-4-4"/><path d="m8 12 8 8"/><path d="m16 8-8-8"/><path d="m16.71 13.88-3.59-3.59a2 2 0 1 0-2.83 2.83l3.59 3.59a2 2 0 1 0 2.83-2.83z"/></svg>` },
              { name: 'Show GPS Data', cmd: 'gpsdata', desc: 'Displays the most recently parsed GPS information (Coordinates, Satellites, Fix).', icon: `<svg ${SVG_PROPS}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></svg>` },
              { name: 'Start Tracker', cmd: 'gpstracker -c start', desc: 'Starts the GPS background tracking service.', icon: `<svg ${SVG_PROPS}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>` },
              { name: 'Stop Tracker', cmd: 'gpstracker -c stop', desc: 'Stops the GPS background tracking service.', icon: `<svg ${SVG_PROPS}><circle cx="12" cy="12" r="10"/><path d="m4.93 4.93 14.14 14.14"/></svg>` },
              { name: 'Mark POI', cmd: 'gpspoi -m', desc: 'Tags a GPS Point of Interest during a wardrive.', icon: `<svg ${SVG_PROPS}><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><path d="M12 7v6l4 2"/></svg>` }
            ]
          },
          {
            name: 'Device', icon: `<svg ${SVG_PROPS}><rect x="4" y="4" width="16" height="16" rx="2" ry="2"/><rect x="9" y="9" width="6" height="6"/></svg>`,
            items: [
              { name: 'Device Info', cmd: 'status', desc: 'Requests the current system status, memory usage, and target counts from the firmware.', icon: `<svg ${SVG_PROPS}><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>` },
              { name: 'Help', cmd: 'help', desc: 'Prints the standard firmware help menu and list of all available commands to the terminal.', icon: `<svg ${SVG_PROPS}><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>` }
            ]
          },
          {
            name: 'Reboot', icon: `<svg ${SVG_PROPS}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>`,
            cmd: 'reboot'
          }
        ]
      };

      let menuStack = [menuData];

      function renderMenu() {
        const current = menuStack[menuStack.length - 1];
        $('#menu-title').textContent = current.name;
        const backBtn = $('#menu-back-btn');
        const body = $('#menu-body');

        if (menuStack.length > 1) backBtn.style.display = 'block';
        else backBtn.style.display = 'none';

        body.innerHTML = '';

        // Normal menu list rendering
        current.items.forEach(item => {
          const div = document.createElement('div');
          div.className = 'tft-menu-item';

          if (item.cmd) {
            // It's a command action -> Executes immediately (like TFT display)
            div.innerHTML = `<div class="tft-menu-item-content">
                           <span class="item-title">${item.name}</span>
                           ${item.desc ? `<span class="item-desc">${item.desc}</span>` : ''}
                         </div>
                         ${item.icon || `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M10 8l6 4-6 4V8z"/></svg>`}`;
            div.addEventListener('click', () => {
              sendCommand(item.cmd);
            });
          } else if (item.items) {
            // It's a folder -> goes to sub-menu
            div.innerHTML = `<span class="item-title">${item.name}</span>${item.icon || `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>`}`;
            div.addEventListener('click', () => {
              menuStack.push(item);
              renderMenu();
            });
          }
          body.appendChild(div);
        });
      }

      $('#menu-back-btn').addEventListener('click', () => {
        if (menuStack.length > 1) {
          menuStack.pop();
          renderMenu();
        }
      });

      renderMenu(); // Init menu

      const SCAN_MODES = {
        0: 'OFF', 1: 'PROBE', 2: 'AP SCAN', 3: 'PWN', 4: 'EAPOL', 5: 'DEAUTH SNIFF',
        6: 'SCAN ALL', 7: 'PKT MON', 8: 'BEACON SPAM', 9: 'RICKROLL', 10: 'BT SCAN',
        11: 'BT SKIM', 15: 'BEACON LIST', 16: 'TARGET AP', 20: 'DEAUTH',
        21: 'AP SPAM', 25: 'RAW CAP', 26: 'STA SCAN', 29: 'SIG STR',
        30: 'EVIL PORTAL', 32: 'WARDRIVE', 50: 'PINESCAN', 51: 'MULTISSID',
        77: 'SAE SNIFF', 78: 'SAE ATK', 79: 'CSA ATK', 80: 'QUIET ATK'
      };

      async function connect() {
        if (isConnected) { await disconnect(); return; }

        const driverPref = document.getElementById('driver-select').value;
        const hasSerial = 'serial' in navigator;
        const hasUsb = 'usb' in navigator;

        if (driverPref === 'webserial' && hasSerial) {
          activeSerial = new StandardSerial();
        } else if (driverPref === 'webusb' && hasUsb) {
          activeSerial = new WebUSBSerial();
        } else if (driverPref === 'auto' || driverPref === 'webserial') {
          // Auto logic: Use WebUSB on Android by default because Web Serial can be buggy, otherwise Web Serial
          const isAndroid = /Android/i.test(navigator.userAgent);
          if (isAndroid && hasUsb) {
            activeSerial = new WebUSBSerial();
          } else if (hasSerial) {
            activeSerial = new StandardSerial();
          } else if (hasUsb) {
            activeSerial = new WebUSBSerial();
          } else {
            appendLine('No supported serial API found on this browser.', 'error');
            return;
          }
        } else {
          appendLine('Selected driver not supported on this browser.', 'error');
          return;
        }

        try {
          await activeSerial.connect(parseInt(document.getElementById('baud-select').value));
          activeSerial.onData = (text) => processIncoming(text);
          isConnected = true; connectTime = Date.now();
          updateConnectionUI();
          appendLine(activeSerial instanceof StandardSerial ? 'CONNECTED VIA WEB SERIAL' : 'CONNECTED VIA CUSTOM WEBUSB DRIVER', 'success');
          uptimeInterval = setInterval(updateUptime, 1000);
          statusInterval = setInterval(() => { if (isConnected) sendCommand('status', true); }, 5000);
          setTimeout(() => sendCommand('status', true), 1000);
        } catch (err) {
          if (err.message.includes('No port selected')) {
            appendLine('CONNECTION CANCELLED: You must select a device from the popup.', 'error');
            appendLine('NOTE: If no popup appeared, your browser (like WhatsApp in-app browser) blocks USB selection. Please open this page in standard Google Chrome.', 'info');
          } else {
            appendLine('CONNECTION FAILED: ' + err.message, 'error');
          }
        }
      }

      async function disconnect() {
        if (activeSerial) await activeSerial.disconnect();
        isConnected = false; clearInterval(uptimeInterval); clearInterval(statusInterval);
        updateConnectionUI(); appendLine('DISCONNECTED', 'info');
      }

      function processIncoming(text) {
        lineBuffer += text;
        const parts = lineBuffer.split('\n');
        lineBuffer = parts.pop();
        for (const raw of parts) {
          // Strip carriage return and leading prompt ("> ")
          let line = raw.replace(/\r$/, '').trim();
          if (line.startsWith('>')) {
            line = line.substring(1).trim();
          }

          if (line === '' || line === '> ') continue;
          if (line.startsWith('@WEBUI:')) {
            try { updateDashboard(JSON.parse(line.substring(7))); } catch (e) { }
            continue;
          }

          // Prevent the background polling command from spamming the terminal
          if (/^#?(status|list -[acb])$/.test(line)) continue;

          // Filter out original Marauder ASCII art (lines containing only ASCII art characters)
          if (line.length > 0 && /^[ \/_|\\.'-]+$/.test(line)) { continue; }
          // Filter out standard headers
          if (line.includes('ESP32 Marauder') || line.match(/^\s*v\d+\.\d+/)) { continue; }
          if (line.includes('By: justcallmekoko')) {
            const svgSkull = `<svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" fill="currentColor" style="width:120px; height:120px; margin: 15px 0;"><path d="M0 0h16v12h-2v4H2v-4H0V0zm2 2v8h2v4h1v-2h2v2h2v-2h2v2h1v-4h2V2H2zm6 6l1.414 1.414-.707.707L8 9.414l-.707.707-.707-.707L8 8zm2-3h2v2h-2V5zM4 5h2v2H4V5z" fill-rule="evenodd" /></svg>`;
            appendHTML(svgSkull, 'info');
            appendLine('--------------------------------', 'info');
            appendLine('DMATRIX OS', 'info');
            appendLine('v1.0.0', 'info');
            appendLine('--------------------------------', 'info');
            continue;
          }

          // Parse AP List: [0][CH:1] MyWiFiNetwork -50
          let apMatch = line.match(/^\[(\d+)\]\[CH:(\d+)\]\s+(.+?)\s+(-\d+)(?:\s+\(selected\))?$/);
          if (apMatch) {
            const isSelected = line.endsWith('(selected)');
            appendRow('ap-table-body', 'select -a ' + apMatch[1], [apMatch[1], apMatch[2], apMatch[3], apMatch[4]], isSelected);
          }

          // Parse Station List: [0] 00:11:22:33:44:55
          let staMatch = line.match(/^\[(\d+)\]\s+([0-9a-fA-F:-]{17})(?:\s+\(selected\))?$/);
          if (staMatch) {
            const isSelected = line.endsWith('(selected)');
            appendRow('sta-table-body', 'select -c ' + staMatch[1], [staMatch[1], staMatch[2]], isSelected);
          }

          // Parse BLE List: [0][RSSI:-55] Name
          let bleMatch = line.match(/^\[(\d+)\]\[RSSI:(-\d+)\]\s+(.+)$/);
          if (bleMatch) {
            appendRow('ble-table-body', 'select -b ' + bleMatch[1], [bleMatch[1], bleMatch[3], bleMatch[2]], false);
          }

          let cls = '';
          if (line.startsWith('#')) cls = 'cmd';
          else if (/error|fail/i.test(line)) cls = 'error';
          else if (/success|found|started|stopping/i.test(line)) cls = 'success';

          appendLine(line, cls);
        }
      }

      function appendRow(tbodyId, cmd, cols, isSelected) {
        const tr = document.createElement('tr');
        tr.style.cursor = 'pointer';
        if (isSelected) tr.style.backgroundColor = '#d4edda';

        tr.onclick = () => {
          sendCommand(cmd);
          setTimeout(() => $('#refresh-targets-btn').click(), 500);
        };

        cols.forEach(c => {
          const td = document.createElement('td');
          td.textContent = c;
          tr.appendChild(td);
        });
        $('#' + tbodyId).appendChild(tr);
      }

      let lastAps = -1, lastStas = -1, lastBle = -1;

      function updateDashboard(d) {
        let changed = false;

        if (d.mode !== undefined) {
          $('#val-mode').textContent = d.mode_name || SCAN_MODES[d.mode] || 'MODE ' + d.mode;
          if (d.mode !== 0) $('#card-mode').style.color = '#fff';
          else $('#card-mode').style.color = 'inherit';
        }
        if (d.aps !== undefined) {
          $('#val-aps').textContent = d.aps; $('#acc-aps-count').textContent = d.aps;
          if (lastAps !== -1 && d.aps !== lastAps) changed = true;
          lastAps = d.aps;
        }
        if (d.stas !== undefined) {
          $('#val-sta').textContent = d.stas; $('#acc-sta-count').textContent = d.stas;
          if (lastStas !== -1 && d.stas !== lastStas) changed = true;
          lastStas = d.stas;
        }
        if (d.ble !== undefined) {
          $('#val-ble').textContent = d.ble; $('#acc-ble-count').textContent = d.ble;
          if (lastBle !== -1 && d.ble !== lastBle) changed = true;
          lastBle = d.ble;
        }
        if (d.ch !== undefined) $('#val-ch').textContent = d.ch;

        if (changed) {
          refreshTargets(true);
        }
      }

      let isScanning = false;
      let targetPollInterval = null;

      async function sendCommand(cmd, silent) {
        if (!isConnected || !activeSerial) return;

        // Auto-refresh fallback for older firmwares that don't support JSON status
        if (!silent) {
          if (cmd === 'stopscan') {
            isScanning = false;
            if (targetPollInterval) clearInterval(targetPollInterval);
          } else if (cmd.includes('scan') || cmd.includes('sniff')) {
            isScanning = true;
            if (targetPollInterval) clearInterval(targetPollInterval);
            targetPollInterval = setInterval(() => {
              if (isScanning && isConnected) refreshTargets(true);
            }, 8000);
          }
        }

        try {
          // Send carriage return as well for broader firmware compatibility
          await activeSerial.write(cmd + '\r\n');
          if (!silent) { appendLine(cmd, 'cmd'); commandHistory.unshift(cmd); if (commandHistory.length > 50) commandHistory.pop(); historyIndex = -1; }
        } catch (e) { appendLine('SEND ERROR: ' + e.message, 'error'); }
      }

      function appendLine(text, cls) {
        const div = document.createElement('div');
        div.className = 'line' + (cls ? ' ' + cls : '');
        div.textContent = text;
        terminalBody.appendChild(div);
        lines++;
        lineCountEl.textContent = lines;
        while (terminalBody.children.length > 2000) terminalBody.removeChild(terminalBody.firstChild);
        terminalBody.scrollTop = terminalBody.scrollHeight;
      }

      function appendHTML(html, cls) {
        const div = document.createElement('div');
        div.className = 'line' + (cls ? ' ' + cls : '');
        div.innerHTML = html;
        terminalBody.appendChild(div);
        lines++;
        lineCountEl.textContent = lines;
        while (terminalBody.children.length > 2000) terminalBody.removeChild(terminalBody.firstChild);
        terminalBody.scrollTop = terminalBody.scrollHeight;
      }

      function updateUptime() {
        if (!connectTime) return;
        const s = Math.floor((Date.now() - connectTime) / 1000);
        const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
        const p = n => String(n).padStart(2, '0');
        $('#val-uptime').textContent = (h > 0 ? h + ':' : '') + p(m) + ':' + p(sec);
      }

      function updateConnectionUI() {
        if (isConnected) {
          statusDot.classList.add('connected');
          statusText.textContent = 'Online';
          connectBtn.textContent = 'Disconnect';
        } else {
          statusDot.classList.remove('connected');
          statusText.textContent = 'Offline';
          connectBtn.textContent = 'Connect';
        }
      }

      connectBtn.addEventListener('click', connect);
      sendBtn.addEventListener('click', () => { const c = cmdInput.value.trim(); if (c) { sendCommand(c); cmdInput.value = ''; } });
      cmdInput.addEventListener('keydown', e => {
        if (e.key === 'Enter') { const c = cmdInput.value.trim(); if (c) { sendCommand(c); cmdInput.value = ''; } }
        else if (e.key === 'ArrowUp') { e.preventDefault(); if (commandHistory.length) { historyIndex = Math.min(historyIndex + 1, commandHistory.length - 1); cmdInput.value = commandHistory[historyIndex]; } }
        else if (e.key === 'ArrowDown') { e.preventDefault(); if (historyIndex > 0) { historyIndex--; cmdInput.value = commandHistory[historyIndex]; } else { historyIndex = -1; cmdInput.value = ''; } }
      });
      function refreshTargets(silent = false) {
        $('#ap-table-body').innerHTML = '';
        $('#sta-table-body').innerHTML = '';
        $('#ble-table-body').innerHTML = '';
        sendCommand('list -a', silent);
        setTimeout(() => sendCommand('list -c', silent), 500);
        setTimeout(() => sendCommand('list -b', silent), 1000);
      }

      clearBtn.addEventListener('click', () => { terminalBody.innerHTML = ''; lines = 0; lineCountEl.textContent = '0'; });
      stopBtn.addEventListener('click', () => sendCommand('stopscan'));
      refreshBtn.addEventListener('click', () => refreshTargets(false));
      document.querySelectorAll('.accordion-header').forEach(h => h.addEventListener('click', () => { h.classList.toggle('open'); h.nextElementSibling.classList.toggle('open'); }));
      window.addEventListener('beforeunload', () => { if (isConnected) disconnect(); });

      appendLine('ESP32 DMATRIX WEB UI', 'info');
      appendLine('Click Connect to begin.', '');
    })();
  </script>
