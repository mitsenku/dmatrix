<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ESP32 dmatrix — Web UI</title>
  <meta name="description" content="Neumorphic B&W Web UI for ESP32 dmatrix">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #f4f4f0;
      --white: #ffffff;
      --black: #000000;
      --gray: #d0d0d0;
      --accent: #ff4040;

      --font: 'Inter', sans-serif;
      --mono: 'JetBrains Mono', monospace;

      --border: 4px solid var(--black);
      --border-thin: 2px solid var(--black);
      --shadow: none;
      --shadow-sm: none;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      font-size: 16px;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--black);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── UTILS ── */
    .card {
      background: var(--white);
      border: var(--border);
      box-shadow: var(--shadow);
    }

    /* ── BUTTONS ── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 18px;
      background: var(--white);
      border: var(--border-thin);
      color: var(--black);
      font-family: var(--mono);
      font-size: 0.8rem;
      font-weight: 800;
      cursor: pointer;
      text-transform: uppercase;
      transition: background 0.1s;
    }

    .btn:hover {
      background: #eee;
    }

    .btn:active {
      background: #ddd;
    }

    .btn svg {
      width: 16px;
      height: 16px;
    }

    /* ── LAYOUT ── */
    .app {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .main-content-row {
      display: grid;
      grid-template-columns: 350px 1fr;
      gap: 24px;
      align-items: start;
    }

    .left-column {
      display: flex;
      flex-direction: column;
      gap: 24px;
      min-width: 0;
      height: 600px;
    }

    /* ── CONNECTION BAR ── */
    .conn-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 24px;
      flex-wrap: wrap;
    }

    .conn-bar .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .conn-bar .logo svg {
      width: 32px;
      height: 32px;
    }

    .conn-bar .logo h1 {
      font-size: 1.4rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .conn-bar .version {
      padding: 4px 10px;
      font-family: var(--mono);
      font-size: 0.75rem;
      font-weight: 700;
      background: var(--black);
      color: var(--white);
    }

    .conn-bar .spacer {
      flex: 1;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 14px;
      height: 14px;
      border: var(--border-thin);
      background: var(--white);
      transition: 0.3s;
    }

    .status-dot.connected {
      background: var(--black);
      animation: blink 2s infinite;
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.3;
      }
    }

    .status-text {
      font-family: var(--mono);
      font-size: 0.8rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .baud-select {
      background: var(--white);
      border: var(--border-thin);
      padding: 8px 12px;
      font-family: var(--mono);
      font-size: 0.8rem;
      font-weight: 700;
      outline: none;
      cursor: pointer;
    }

    /* ── DASHBOARD ── */
    .dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 8px;
    }

    .stat-card {
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      border: var(--border-thin);
      background: var(--white);
      box-shadow: var(--shadow-sm);
    }

    .stat-card .card-label {
      font-family: var(--mono);
      font-size: 0.6rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .stat-card .card-value {
      font-size: 1.2rem;
      font-weight: 900;
      font-family: var(--font);
    }

    /* ── TFT MENU SYSTEM ── */
    .tft-menu-panel {
      padding: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      max-height: 250px;
      flex-shrink: 0;
    }

    .tft-menu-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      background: var(--black);
      color: var(--white);
      border-bottom: var(--border);
    }

    .tft-menu-header .btn-back {
      padding: 6px 12px;
      font-size: 0.75rem;
      background: var(--white);
      color: var(--black);
      border: none;
    }

    .tft-menu-header .btn-back:hover {
      background: #eee;
    }

    .tft-menu-header .btn-back:active {
      background: #ddd;
    }

    .tft-menu-title {
      font-size: 1.1rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2px;
      flex: 1;
      text-align: right;
    }

    .tft-menu-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
      background: var(--bg);
    }

    .tft-menu-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background: var(--white);
      border: var(--border-thin);
      cursor: pointer;
      transition: background 0.1s;
    }

    .tft-menu-item:hover {
      background: #eee;
    }

    .tft-menu-item:active {
      background: #ddd;
    }

    .tft-menu-item .item-title {
      font-family: var(--mono);
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .tft-menu-item-content {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
      padding-right: 16px;
    }

    .tft-menu-item .item-desc {
      font-size: 0.75rem;
      font-family: var(--font);
      font-weight: 600;
      line-height: 1.4;
      color: #444;
      text-transform: none;
      letter-spacing: normal;
    }

    .tft-menu-item svg {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
    }

    /* ── TERMINAL ── */
    .terminal-panel {
      padding: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 600px;
    }

    .terminal-header {
      display: flex;
      align-items: center;
      padding: 12px 20px;
      border-bottom: var(--border-thin);
      background: #eee;
    }

    .terminal-header .title {
      font-size: 0.9rem;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .terminal-header .spacer {
      flex: 1;
    }

    .terminal-header .line-count {
      font-family: var(--mono);
      font-size: 0.75rem;
      font-weight: 700;
      margin-right: 16px;
    }

    .terminal-body {
      flex: 1;
      min-height: 300px;
      overflow-y: auto;
      padding: 16px 20px;
      font-family: var(--mono);
      font-size: 0.8rem;
      line-height: 1.6;
      background: var(--black);
      color: var(--white);
    }

    .terminal-body .line {
      white-space: pre-wrap;
      word-break: break-all;
      color: #ccc;
    }

    .terminal-body .line.cmd {
      color: #fff;
      font-weight: 700;
    }

    .terminal-body .line.cmd::before {
      content: ">> ";
      color: var(--accent);
    }

    .terminal-body .line.info {
      color: #88ff88;
      font-weight: 700;
    }

    .terminal-body .line.error {
      color: var(--accent);
      text-decoration: underline;
    }

    .terminal-body .line.success {
      color: #00ffff;
      font-weight: 700;
    }

    .terminal-input-bar {
      display: flex;
      align-items: center;
      border-top: var(--border-thin);
    }

    .terminal-input-bar input {
      flex: 1;
      border: none;
      outline: none;
      font-family: var(--mono);
      font-size: 0.9rem;
      font-weight: 700;
      padding: 16px;
      background: var(--white);
    }

    .terminal-input-bar .btn {
      border: none;
      border-left: var(--border-thin);
      border-radius: 0;
      box-shadow: none;
      height: 100%;
      padding: 16px 24px;
    }

    .terminal-input-bar .btn:hover {
      background: #ddd;
    }

    .terminal-input-bar .btn:active {
      transform: none;
      background: #ccc;
    }

    /* ── TARGETS ── */
    .targets-panel {
      padding: 24px;
      display: flex;
      flex-direction: column;
      flex: 1;
      overflow-y: auto;
    }

    .targets-panel>.panel-title {
      font-size: 1.2rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .accordion {
      margin-bottom: 16px;
      border: var(--border-thin);
      background: var(--white);
      box-shadow: var(--shadow-sm);
    }

    .accordion-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      font-family: var(--mono);
      font-weight: 800;
      font-size: 0.9rem;
      cursor: pointer;
      background: #eee;
    }

    .accordion-header:active {
      background: #ddd;
    }

    .accordion-header svg.chevron {
      width: 16px;
      height: 16px;
      transition: transform 0.2s;
    }

    .accordion-header.open svg.chevron {
      transform: rotate(90deg);
    }

    .accordion-header.open {
      border-bottom: var(--border-thin);
    }

    .accordion-header .acc-count {
      margin-left: auto;
      background: var(--black);
      color: var(--white);
      padding: 2px 8px;
    }

    .accordion-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
      background: var(--white);
    }

    .accordion-body.open {
      max-height: 600px;
    }

    .target-table {
      width: 100%;
      border-collapse: collapse;
    }

    .target-table th {
      text-align: left;
      padding: 8px 10px;
      font-size: 0.7rem;
      font-weight: 800;
      text-transform: uppercase;
      border-bottom: var(--border-thin);
      background: #fafafa;
    }

    .target-table td {
      padding: 8px 10px;
      font-family: var(--mono);
      font-size: 0.75rem;
      font-weight: 600;
      border-bottom: 1px solid var(--black);
    }

    /* ── MOBILE: DENSE CYBERDECK SPLIT-SCREEN ── */
    @media (max-width: 900px) {
      .main-content-row {
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .tft-menu-item svg {
        width: 18px;
        height: 18px;
      }

      .tft-menu-item .item-title {
        font-size: 0.8rem;
      }

      .tft-menu-item .item-desc {
        font-size: 0.65rem;
      }

      .terminal-body {
        font-size: 0.7rem;
      }
    }

    @media (max-width: 768px) {
      body {
        overflow: hidden;
      }

      /* Prevent entire page from bouncing/scrolling */
      .app {
        padding: 8px;
        gap: 8px;
        height: 100vh;
        overflow-y: auto;
      }

      /* Sleek Navbar for Mobile */
      .conn-bar {
        padding: 8px 12px;
        gap: 8px;
        justify-content: space-between;
        flex-wrap: nowrap;
        flex-shrink: 0;
      }

      .conn-bar .logo svg {
        width: 18px;
        height: 18px;
      }

      .conn-bar .logo h1 {
        font-size: 1rem;
      }

      .conn-bar .version,
      .baud-select,
      .status-text {
        display: none;
      }

      .conn-bar .btn {
        padding: 6px 12px;
        font-size: 0.7rem;
      }

      .conn-bar .spacer {
        flex: 1;
      }

      .dashboard {
        grid-template-columns: repeat(5, 1fr);
        gap: 4px;
        flex-shrink: 0;
      }

      .stat-card .card-label {
        font-size: 0.5rem;
        letter-spacing: 0;
      }

      .stat-card .card-value {
        font-size: 1rem;
      }

      .stat-card {
        padding: 6px 4px;
      }

      #card-uptime {
        display: none;
      }

      /* Save space on mobile dashboard */

      /* Game Console Layout */
      .main-content-row {
        display: flex;
        flex-direction: column-reverse;
        gap: 8px;
        height: calc(100vh - 120px);
        flex-shrink: 0;
        align-items: stretch;
      }

      .left-column {
        height: auto;
        gap: 8px;
      }

      .tft-menu-panel {
        display: flex;
        flex-direction: column;
        overflow: hidden;
        flex-shrink: 0;
      }

      .terminal-panel {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* Scale Down Menu */
      .tft-menu-header {
        padding: 8px;
      }

      .tft-menu-title {
        font-size: 0.8rem;
        letter-spacing: 1px;
      }

      .tft-menu-header .btn-back {
        padding: 4px 8px;
        font-size: 0.6rem;
      }

      .tft-menu-body {
        padding: 4px;
        gap: 4px;
        max-height: 40vh;
        overflow-y: auto;
      }

      .tft-menu-item {
        padding: 8px;
      }

      .tft-menu-item svg {
        display: none;
      }

      .tft-menu-item-content {
        padding-right: 0;
        gap: 2px;
      }

      .tft-menu-item .item-title {
        font-size: 0.75rem;
      }

      .tft-menu-item .item-desc {
        font-size: 0.6rem;
        line-height: 1.1;
      }

      /* Scale Down Terminal */
      .terminal-header {
        padding: 8px;
      }

      .terminal-header .title {
        font-size: 0.7rem;
        letter-spacing: 1px;
      }

      .terminal-header .line-count {
        font-size: 0.6rem;
        margin-right: 8px;
      }

      .terminal-header .btn {
        padding: 4px 8px;
        font-size: 0.6rem;
      }

      .terminal-body {
        padding: 8px;
        font-size: 0.6rem;
        flex: 1;
        min-height: 0;
        max-height: none;
        overflow-y: auto;
      }

      .terminal-input-bar input {
        padding: 8px;
        font-size: 0.7rem;
      }

      .terminal-input-bar .btn {
        padding: 8px 12px;
        font-size: 0.7rem;
      }

      /* Scale Down Targets */
      .targets-panel { padding: 8px; }
      .targets-panel > .panel-title { font-size: 0.8rem; margin-bottom: 8px; letter-spacing: 1px; }
      .targets-panel > .panel-title .btn { padding: 4px 8px; font-size: 0.6rem; }
      .accordion { margin-bottom: 8px; }
      .accordion-header { padding: 8px; font-size: 0.75rem; gap: 8px; }
      .accordion-header svg.chevron { width: 14px; height: 14px; }
      .target-table th { padding: 6px 8px; font-size: 0.6rem; }
      .target-table td { padding: 6px 8px; font-size: 0.65rem; }
    }

    @media (max-width: 480px) {
      .stat-card .card-value {
        font-size: 0.8rem;
      }
    }
  </style>
</head>

<body>
  <div class="app">

    <!-- CONNECTION BAR -->
    <div class="conn-bar card">
      <div class="logo">
        <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" fill="currentColor">
          <path d="M0 0h16v12h-2v4H2v-4H0V0zm2 2v8h2v4h1v-2h2v2h2v-2h2v2h1v-4h2V2H2zm6 6l1.414 1.414-.707.707L8 9.414l-.707.707-.707-.707L8 8zm2-3h2v2h-2V5zM4 5h2v2H4V5z" fill-rule="evenodd"/>
        </svg>
        <h1>dmatrix</h1>
      </div>
      <span class="version" id="version-badge">--</span>
      <div class="spacer"></div>
      <select class="baud-select" id="baud-select">
        <option value="115200" selected>115200 Baud</option>
        <option value="9600">9600 Baud</option>
      </select>
      <div class="status-indicator">
        <div class="status-dot" id="status-dot"></div>
        <span class="status-text" id="status-text">Offline</span>
      </div>
      <button class="btn" id="connect-btn">Connect</button>
    </div>

    <!-- DASHBOARD -->
    <div class="dashboard" id="dashboard">
      <div class="stat-card" id="card-mode">
        <span class="card-label">Mode</span>
        <span class="card-value" id="val-mode">OFF</span>
      </div>
      <div class="stat-card" id="card-aps">
        <span class="card-label">APs</span>
        <span class="card-value" id="val-aps">0</span>
      </div>
      <div class="stat-card" id="card-sta">
        <span class="card-label">Stations</span>
        <span class="card-value" id="val-sta">0</span>
      </div>
      <div class="stat-card" id="card-ble">
        <span class="card-label">BLE</span>
        <span class="card-value" id="val-ble">0</span>
      </div>
      <div class="stat-card" id="card-ch">
        <span class="card-label">Channel</span>
        <span class="card-value" id="val-ch">--</span>
      </div>
      <div class="stat-card" id="card-uptime">
        <span class="card-label">Uptime</span>
        <span class="card-value" id="val-uptime">--</span>
      </div>
    </div>

    <!-- MAIN ROW: MENU & TERMINAL -->
    <div class="main-content-row">
      <!-- LEFT COLUMN -->
      <div class="left-column">
        <!-- TFT MENU WITH HELP DESCRIPTIONS -->
        <div class="tft-menu-panel card" id="tft-menu-container">
        <div class="tft-menu-header">
          <button class="btn-back" id="menu-back-btn" style="display:none;">&lt; BACK</button>
          <span class="tft-menu-title" id="menu-title">MAIN MENU</span>
        </div>
        <div class="tft-menu-body" id="menu-body">
          <!-- Injected by JS -->
        </div>
      </div>

        <!-- TARGETS -->
        <div class="targets-panel card">
      <div class="panel-title">
        TARGETS
        <button class="btn" id="refresh-targets-btn" style="padding: 6px 12px; font-size: 0.7rem;">Refresh</button>
      </div>
      <div class="accordion">
        <div class="accordion-header" id="acc-aps-header">
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="9 18 15 12 9 6" />
          </svg>
          ACCESS POINTS<span class="acc-count" id="acc-aps-count">0</span>
        </div>
        <div class="accordion-body" id="acc-aps-body">
          <table class="target-table">
            <thead>
              <tr>
                <th>#</th>
                <th>CH</th>
                <th>ESSID</th>
                <th>RSSI</th>
              </tr>
            </thead>
            <tbody id="ap-table-body"></tbody>
          </table>
        </div>
      </div>
      <div class="accordion">
        <div class="accordion-header" id="acc-sta-header">
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="9 18 15 12 9 6" />
          </svg>
          STATIONS<span class="acc-count" id="acc-sta-count">0</span>
        </div>
        <div class="accordion-body" id="acc-sta-body">
          <table class="target-table">
            <thead>
              <tr>
                <th>#</th>
                <th>MAC</th>
                <th>AP</th>
              </tr>
            </thead>
            <tbody id="sta-table-body"></tbody>
          </table>
        </div>
      </div>
      <div class="accordion">
        <div class="accordion-header" id="acc-ble-header">
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="9 18 15 12 9 6" />
          </svg>
          BLE DEVICES<span class="acc-count" id="acc-ble-count">0</span>
        </div>
        <div class="accordion-body" id="acc-ble-body">
          <table class="target-table">
            <thead>
              <tr>
                <th>#</th>
                <th>Device</th>
                <th>RSSI</th>
              </tr>
            </thead>
            <tbody id="ble-table-body"></tbody>
          </table>
        </div>
      </div>
        </div>
      </div>

      <!-- TERMINAL -->
      <div class="terminal-panel card">
        <div class="terminal-header">
          <span class="title">TERMINAL</span>
          <div class="spacer"></div>
          <span class="line-count" id="line-count">0</span>
          <button class="btn" id="stop-btn" style="padding: 6px 12px; font-size: 0.7rem; color: #ff4444;">Stop All</button>
          <button class="btn" id="clear-btn" style="padding: 6px 12px; font-size: 0.7rem;">Clear</button>
        </div>
        <div class="terminal-body" id="terminal-body"></div>
        <div class="terminal-input-bar">
          <input type="text" id="cmd-input" placeholder="Type a command..." autocomplete="off" spellcheck="false"
            autocapitalize="none">
          <button class="btn" id="send-btn">Send</button>
        </div>
      </div>
    </div>

  </div>

  <script>
    (function () {
      'use strict';
      const $ = (s) => document.querySelector(s);
      const connectBtn = $('#connect-btn'), statusDot = $('#status-dot'), statusText = $('#status-text');
      const baudSelect = $('#baud-select'), versionBadge = $('#version-badge');
      const terminalBody = $('#terminal-body'), cmdInput = $('#cmd-input');
      const sendBtn = $('#send-btn'), clearBtn = $('#clear-btn'), stopBtn = $('#stop-btn');
      const lineCountEl = $('#line-count'), refreshBtn = $('#refresh-targets-btn');

      let isConnected = false, lines = 0;
      let connectTime = null, uptimeInterval = null, statusInterval = null;
      let commandHistory = [], historyIndex = -1, lineBuffer = '';

      class StandardSerial {
        constructor() { this.port = null; this.reader = null; this.writer = null; this.onData = null; }
        async connect(baudRate) {
          this.port = await navigator.serial.requestPort();
          await this.port.open({ baudRate });
          this.writer = this.port.writable.getWriter();
          this.readLoop();
        }
        async readLoop() {
          const dec = new TextDecoder();
          this.reader = this.port.readable.getReader();
          try {
            while (true) {
              const { value, done } = await this.reader.read();
              if (done) break;
              if (value && this.onData) this.onData(dec.decode(value));
            }
          } catch (e) { } finally {
            this.reader.releaseLock();
          }
        }
        async write(text) {
          if (!this.writer) return;
          await this.writer.write(new TextEncoder().encode(text));
        }
        async disconnect() {
          if (this.reader) { await this.reader.cancel(); this.reader.releaseLock(); }
          if (this.writer) { await this.writer.close(); this.writer.releaseLock(); }
          if (this.port) await this.port.close();
        }
      }

      class WebUSBSerial {
        constructor() { this.device = null; this.epIn = null; this.epOut = null; this.onData = null; this.reading = false; }
        async connect(baudRate) {
          this.device = await navigator.usb.requestDevice({ filters: [{ vendorId: 0x10c4, productId: 0xea60 }, { vendorId: 0x1a86, productId: 0x7523 }] });
          await this.device.open();
          if (this.device.configuration === null) await this.device.selectConfiguration(1);
          await this.device.claimInterface(0);
          const iface = this.device.configuration.interfaces[0].alternates[0];
          for (const ep of iface.endpoints) { if (ep.direction === 'in') this.epIn = ep.endpointNumber; if (ep.direction === 'out') this.epOut = ep.endpointNumber; }

          if (this.device.vendorId === 0x10c4) { // CP2102
            await this.device.controlTransferOut({ requestType: 'vendor', recipient: 'device', request: 0x00, value: 0x01, index: 0 });
            const buf = new ArrayBuffer(4); new DataView(buf).setUint32(0, baudRate, true);
            await this.device.controlTransferOut({ requestType: 'vendor', recipient: 'device', request: 0x1E, value: 0, index: 0 }, buf);
          } else if (this.device.vendorId === 0x1a86) { // CH340
            await this.device.controlTransferOut({ requestType: 'vendor', recipient: 'device', request: 0xA1, value: 0xC29C, index: 0xB2B9 });
            await this.device.controlTransferOut({ requestType: 'vendor', recipient: 'device', request: 0xA4, value: 0xDF, index: 0 });
            await this.device.controlTransferOut({ requestType: 'vendor', recipient: 'device', request: 0xA4, value: 0x9F, index: 0 });
            await this.device.controlTransferOut({ requestType: 'vendor', recipient: 'device', request: 0x9A, value: 0x1312, index: 0xCC1A });
            await this.device.controlTransferOut({ requestType: 'vendor', recipient: 'device', request: 0x9A, value: 0x0f2c, index: 0x0008 });
          }
          this.reading = true; this.readLoop();
        }
        async readLoop() {
          const dec = new TextDecoder();
          while (this.reading && this.device.opened) {
            try {
              const res = await this.device.transferIn(this.epIn, 64);
              if (res.status === 'ok' && res.data.byteLength > 0 && this.onData) this.onData(dec.decode(res.data));
            } catch (e) { break; }
          }
        }
        async write(text) {
          if (!this.device || !this.device.opened) return;
          await this.device.transferOut(this.epOut, new TextEncoder().encode(text));
        }
        async disconnect() { this.reading = false; if (this.device && this.device.opened) await this.device.close(); this.device = null; }
      }

      let activeSerial = null;

      // ─── TFT MENU DATA W/ HELP DESCRIPTIONS ───
      const menuData = {
        name: 'Main Menu',
        items: [
          {
            name: 'Recon',
            items: [
              { name: 'Start WiFi', cmd: 'recon wifi', desc: 'Starts the background WiFi reconnaissance mode.' },
              { name: 'Start BLE', cmd: 'recon ble', desc: 'Starts the background BLE reconnaissance mode.' },
              { name: 'Stop Recon', cmd: 'recon stop', desc: 'Stops any active reconnaissance mode.' }
            ]
          },
          {
            name: 'WiFi',
            items: [
              {
                name: 'Sniffers',
                items: [
                  { name: 'Probe Request Sniff', cmd: 'sniffprobe', desc: 'Listens for Probe Request frames sent by client devices searching for known networks.' },
                  { name: 'Beacon Sniff', cmd: 'sniffbeacon', desc: 'Listens for Beacon frames to populate the list of nearby Access Points. Does not sniff clients.' },
                  { name: 'Deauth Sniff', cmd: 'sniffdeauth', desc: 'Monitors the area for Deauthentication frames, which usually indicate a network attack in progress.' },
                  { name: 'Raw Capture', cmd: 'sniffraw', desc: 'Captures raw WiFi packet data and saves it to the SD card in PCAP format.' },
                  { name: 'Detect Pwnagotchi', cmd: 'sniffpwn', desc: 'Listens for Pwnagotchi communication frames.' },
                  { name: 'EAPOL/PMKID Scan', cmd: 'sniffpmkid', desc: 'Actively requests associations to capture PMKID hashes from WPA2 APs, useful for offline cracking.' },
                  { name: 'SAE Commit', cmd: 'sniffsae', desc: 'Sniffs WPA3 SAE commit frames.' }
                ]
              },
              {
                name: 'Scanners',
                items: [
                  { name: 'Scan AP/STA', cmd: 'scanall', desc: 'Iterates through all 2.4GHz WiFi channels and passively sniffs for both Access Points (APs) and Client Stations.' }
                ]
              },
              {
                name: 'Attacks',
                items: [
                  { name: 'Beacon Spam List', cmd: 'attack -t beacon -l', desc: 'Broadcasts fake Access Point beacons using the SSIDs saved in your saved list.' },
                  { name: 'Beacon Spam Random', cmd: 'attack -t beacon -r', desc: 'Floods the local area with random, randomly-named fake Access Point beacons.' },
                  { name: 'Rick Roll Beacon', cmd: 'attack -t rickroll', desc: 'Broadcasts fake Access Points whose names spell out the lyrics to Never Gonna Give You Up.' },
                  { name: 'Probe Req Flood', cmd: 'attack -t probe', desc: 'Floods the area with Probe Requests for random networks.' },
                  { name: 'Deauth Flood', cmd: 'attack -t deauth', desc: 'Sends continuous Deauthentication frames to targeted clients, disconnecting them from their AP. Warning: Strictly for authorized auditing.' }
                ]
              },
              {
                name: 'General',
                items: [
                  { name: 'Stop Scan', cmd: 'stopscan', desc: 'Immediately halts the current scanning or attacking process.' },
                  { name: 'Clear APs', cmd: 'clearlist -a', desc: 'Clears the list of discovered Access Points from memory.' },
                  { name: 'Clear Stations', cmd: 'clearlist -s', desc: 'Clears the list of discovered Client Stations from memory.' }
                ]
              }
            ]
          },
          {
            name: 'Bluetooth',
            items: [
              {
                name: 'Bluetooth Sniffer',
                items: [
                  { name: 'Bluetooth Sniff', cmd: 'sniffbt', desc: 'Scans the surrounding area for active Bluetooth and BLE devices and records their MAC addresses.' },
                  { name: 'Detect Card Skimmers', cmd: 'sniffskim', desc: 'Skims for BLE data and reads nearby card/tag info.' }
                ]
              },
              {
                name: 'Bluetooth Attacks',
                items: [
                  { name: 'Spam All', cmd: 'blespam -t all', desc: 'Floods nearby BLE-enabled devices (iOS, Android, Windows) with continuous pairing popups.' },
                  { name: 'Sour Apple', cmd: 'blespam -t sourapple', desc: 'Specifically targets Apple devices (iPhones, iPads, AirPods) with BLE pairing popups causing disruption.' },
                  { name: 'Google Spam', cmd: 'blespam -t google', desc: 'Specifically targets Android devices using Google Fast Pair.' }
                ]
              }
            ]
          },
          {
            name: 'Device',
            items: [
              { name: 'Device Info', cmd: 'status', desc: 'Requests the current system status, memory usage, and target counts from the firmware.' },
              { name: 'Channel', cmd: 'channel', desc: 'Prints the current WiFi channel the radio is tuned to.' },
              { name: 'Help', cmd: 'help', desc: 'Prints the standard firmware help menu and list of all available commands to the terminal.' }
            ]
          },
          {
            name: 'Reboot',
            cmd: 'reboot'
          }
        ]
      };

      let menuStack = [menuData];

      function renderMenu() {
        const current = menuStack[menuStack.length - 1];
        $('#menu-title').textContent = current.name;
        const backBtn = $('#menu-back-btn');
        const body = $('#menu-body');

        if (menuStack.length > 1) backBtn.style.display = 'block';
        else backBtn.style.display = 'none';

        body.innerHTML = '';

        // Normal menu list rendering
        current.items.forEach(item => {
          const div = document.createElement('div');
          div.className = 'tft-menu-item';

          if (item.cmd) {
            // It's a command action -> Executes immediately (like TFT display)
            div.innerHTML = `<div class="tft-menu-item-content">
                           <span class="item-title">${item.name}</span>
                           ${item.desc ? `<span class="item-desc">${item.desc}</span>` : ''}
                         </div>
                         <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M10 8l6 4-6 4V8z"/></svg>`;
            div.addEventListener('click', () => {
              sendCommand(item.cmd);
            });
          } else if (item.items) {
            // It's a folder -> goes to sub-menu
            div.innerHTML = `<span class="item-title">${item.name}</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>`;
            div.addEventListener('click', () => {
              menuStack.push(item);
              renderMenu();
            });
          }
          body.appendChild(div);
        });
      }

      $('#menu-back-btn').addEventListener('click', () => {
        if (menuStack.length > 1) {
          menuStack.pop();
          renderMenu();
        }
      });

      renderMenu(); // Init menu

      const SCAN_MODES = {
        0: 'OFF', 1: 'PROBE', 2: 'AP SCAN', 3: 'PWN', 4: 'EAPOL', 5: 'DEAUTH SNIFF',
        6: 'SCAN ALL', 7: 'PKT MON', 8: 'BEACON SPAM', 9: 'RICKROLL', 10: 'BT SCAN',
        11: 'BT SKIM', 15: 'BEACON LIST', 16: 'TARGET AP', 20: 'DEAUTH',
        21: 'AP SPAM', 25: 'RAW CAP', 26: 'STA SCAN', 29: 'SIG STR',
        30: 'EVIL PORTAL', 32: 'WARDRIVE', 50: 'PINESCAN', 51: 'MULTISSID',
        77: 'SAE SNIFF', 78: 'SAE ATK', 79: 'CSA ATK', 80: 'QUIET ATK'
      };

      async function connect() {
        if (isConnected) { await disconnect(); return; }
        
        if ('serial' in navigator) {
          activeSerial = new StandardSerial();
        } else if ('usb' in navigator) {
          activeSerial = new WebUSBSerial();
        } else {
          appendLine('No supported serial API found on this browser.', 'error'); 
          return; 
        }

        try {
          await activeSerial.connect(parseInt(baudSelect.value));
          activeSerial.onData = (text) => processIncoming(text);
          isConnected = true; connectTime = Date.now();
          updateConnectionUI();
          appendLine(activeSerial instanceof StandardSerial ? 'CONNECTED VIA WEB SERIAL' : 'CONNECTED VIA CUSTOM WEBUSB DRIVER', 'success');
          uptimeInterval = setInterval(updateUptime, 1000);
          statusInterval = setInterval(() => { if (isConnected) sendCommand('status', true); }, 5000);
          setTimeout(() => sendCommand('status', true), 1000);
        } catch (err) { appendLine('CONNECTION FAILED: ' + err.message, 'error'); }
      }

      async function disconnect() {
        if (activeSerial) await activeSerial.disconnect();
        isConnected = false; clearInterval(uptimeInterval); clearInterval(statusInterval);
        updateConnectionUI(); appendLine('DISCONNECTED', 'info');
      }

      function processIncoming(text) {
        lineBuffer += text;
        const parts = lineBuffer.split('\n');
        lineBuffer = parts.pop();
        for (const raw of parts) {
          // Strip carriage return and leading prompt ("> ")
          let line = raw.replace(/\r$/, '').trim();
          if (line.startsWith('>')) {
            line = line.substring(1).trim();
          }

          if (line === '' || line === '> ') continue;
          if (line.startsWith('@WEBUI:')) {
            try { updateDashboard(JSON.parse(line.substring(7))); } catch (e) { }
            continue;
          }

          // Prevent the background polling command from spamming the terminal
          if (line === 'status' || line === '#status') continue;

          if (line.includes('ESP32 dmatrix') || line.includes('ESP32 Marauder')) { appendLine(line, 'info'); continue; }
          if (line.match(/^\s*v\d+\.\d+/)) { versionBadge.textContent = line.trim(); appendLine(line, 'info'); continue; }

          // Parse AP List: [0][CH:1] MyWiFiNetwork -50
          let apMatch = line.match(/^\[(\d+)\]\[CH:(\d+)\]\s+(.+?)\s+(-\d+)(?:\s+\(selected\))?$/);
          if (apMatch) {
            const isSelected = line.endsWith('(selected)');
            appendRow('ap-table-body', 'select -a ' + apMatch[1], [apMatch[1], apMatch[2], apMatch[3], apMatch[4]], isSelected);
          }

          // Parse Station List: [0] 00:11:22:33:44:55
          let staMatch = line.match(/^\[(\d+)\]\s+([0-9a-fA-F:-]{17})(?:\s+\(selected\))?$/);
          if (staMatch) {
            const isSelected = line.endsWith('(selected)');
            appendRow('sta-table-body', 'select -c ' + staMatch[1], [staMatch[1], staMatch[2]], isSelected);
          }

          // Parse BLE List: [0][RSSI:-55] Name
          let bleMatch = line.match(/^\[(\d+)\]\[RSSI:(-\d+)\]\s+(.+)$/);
          if (bleMatch) {
            appendRow('ble-table-body', 'select -b ' + bleMatch[1], [bleMatch[1], bleMatch[3], bleMatch[2]], false);
          }

          let cls = '';
          if (line.startsWith('#')) cls = 'cmd';
          else if (/error|fail/i.test(line)) cls = 'error';
          else if (/success|found|started|stopping/i.test(line)) cls = 'success';

          appendLine(line, cls);
        }
      }

      function appendRow(tbodyId, cmd, cols, isSelected) {
        const tr = document.createElement('tr');
        tr.style.cursor = 'pointer';
        if (isSelected) tr.style.backgroundColor = '#d4edda';
        
        tr.onclick = () => { 
          sendCommand(cmd); 
          setTimeout(() => $('#refresh-targets-btn').click(), 500); 
        };
        
        cols.forEach(c => {
          const td = document.createElement('td');
          td.textContent = c;
          tr.appendChild(td);
        });
        $('#' + tbodyId).appendChild(tr);
      }

      function updateDashboard(d) {
        if (d.mode !== undefined) {
          $('#val-mode').textContent = d.mode_name || SCAN_MODES[d.mode] || 'MODE ' + d.mode;
          if (d.mode !== 0) $('#card-mode').style.color = '#fff';
          else $('#card-mode').style.color = 'inherit';
        }
        if (d.aps !== undefined) { $('#val-aps').textContent = d.aps; $('#acc-aps-count').textContent = d.aps; }
        if (d.stas !== undefined) { $('#val-sta').textContent = d.stas; $('#acc-sta-count').textContent = d.stas; }
        if (d.ble !== undefined) { $('#val-ble').textContent = d.ble; $('#acc-ble-count').textContent = d.ble; }
        if (d.ch !== undefined) $('#val-ch').textContent = d.ch;
        if (d.ver) versionBadge.textContent = d.ver;
      }

      async function sendCommand(cmd, silent) {
        if (!isConnected || !activeSerial) return;
        try {
          await activeSerial.write(cmd + '\n');
          if (!silent) { appendLine(cmd, 'cmd'); commandHistory.unshift(cmd); if (commandHistory.length > 50) commandHistory.pop(); historyIndex = -1; }
        } catch (e) { appendLine('SEND ERROR: ' + e.message, 'error'); }
      }

      function appendLine(text, cls) {
        const div = document.createElement('div');
        div.className = 'line' + (cls ? ' ' + cls : '');
        div.textContent = text;
        terminalBody.appendChild(div);
        lines++;
        lineCountEl.textContent = lines;
        while (terminalBody.children.length > 2000) terminalBody.removeChild(terminalBody.firstChild);
        terminalBody.scrollTop = terminalBody.scrollHeight;
      }

      function updateUptime() {
        if (!connectTime) return;
        const s = Math.floor((Date.now() - connectTime) / 1000);
        const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
        const p = n => String(n).padStart(2, '0');
        $('#val-uptime').textContent = (h > 0 ? h + ':' : '') + p(m) + ':' + p(sec);
      }

      function updateConnectionUI() {
        if (isConnected) {
          statusDot.classList.add('connected');
          statusText.textContent = 'Online';
          connectBtn.textContent = 'Disconnect';
        } else {
          statusDot.classList.remove('connected');
          statusText.textContent = 'Offline';
          connectBtn.textContent = 'Connect';
        }
      }

      connectBtn.addEventListener('click', connect);
      sendBtn.addEventListener('click', () => { const c = cmdInput.value.trim(); if (c) { sendCommand(c); cmdInput.value = ''; } });
      cmdInput.addEventListener('keydown', e => {
        if (e.key === 'Enter') { const c = cmdInput.value.trim(); if (c) { sendCommand(c); cmdInput.value = ''; } }
        else if (e.key === 'ArrowUp') { e.preventDefault(); if (commandHistory.length) { historyIndex = Math.min(historyIndex + 1, commandHistory.length - 1); cmdInput.value = commandHistory[historyIndex]; } }
        else if (e.key === 'ArrowDown') { e.preventDefault(); if (historyIndex > 0) { historyIndex--; cmdInput.value = commandHistory[historyIndex]; } else { historyIndex = -1; cmdInput.value = ''; } }
      });
      clearBtn.addEventListener('click', () => { terminalBody.innerHTML = ''; lines = 0; lineCountEl.textContent = '0'; });
      stopBtn.addEventListener('click', () => sendCommand('stopscan'));
      refreshBtn.addEventListener('click', () => { 
        $('#ap-table-body').innerHTML = ''; 
        $('#sta-table-body').innerHTML = ''; 
        $('#ble-table-body').innerHTML = ''; 
        sendCommand('list -a'); 
        setTimeout(() => sendCommand('list -c'), 500); 
        setTimeout(() => sendCommand('list -b'), 1000); 
      });
      document.querySelectorAll('.accordion-header').forEach(h => h.addEventListener('click', () => { h.classList.toggle('open'); h.nextElementSibling.classList.toggle('open'); }));
      window.addEventListener('beforeunload', () => { if (isConnected) disconnect(); });

      appendLine('ESP32 DMATRIX WEB UI', 'info');
      appendLine('Click Connect to begin.', '');
    })();
  </script>
